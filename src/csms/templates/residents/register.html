<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Resident</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="page-container">
        <section class="form-card">
            <p class="label">Resident Management</p>
            <h1>Register Resident</h1>
            <p class="message">Enter the resident's personal and contact information.</p>

            {% if errors %}
                <div class="alert alert-error">
                    <p>Please correct the following information:</p>
                    <ul>
                        {% for error in errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('main.register_resident') }}">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        value="{{ resident.first_name }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        value="{{ resident.last_name }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        required
                    >{{ resident.address }}</textarea>
                </div>

                <div class="form-group">
                    <label for="contact_number">Contact Number</label>
                    <input
                        type="tel"
                        id="contact_number"
                        name="contact_number"
                        value="{{ resident.contact_number }}"
                        placeholder="09XXXXXXXXX"
                        maxlength="11"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ resident.email }}"
                        required
                    >
                </div>

                <div class="form-actions">
                    <button type="submit">Register Resident</button>
                    <a class="button button-danger" href="{{ url_for('main.resident_list') }}">
                        Cancel
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
